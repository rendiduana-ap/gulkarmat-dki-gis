<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peta Sebaran Pos, Sektor, Sudin &amp; Dinas Gulkarmat DKI Jakarta</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1120;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #ef4444;
      --accent-2: #f97316;
      --border: rgba(148, 163, 184, 0.2);
      --ok: #22c55e;
      --warn: #eab308;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 1000;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      flex-shrink: 0;
    }
    .brand h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }
    .brand p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--muted);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .stat-pill strong {
      color: var(--text);
      margin-left: 3px;
    }
    #clockBox {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: #e2e8f0;
    }
    .main {
      display: flex;
      flex: 1;
      min-height: 0;
      position: relative;
    }
    aside {
      width: 350px;
      max-width: 100vw;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 900;
    }
    .filters {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 8px;
      background: var(--panel-2);
    }
    .filters input,
    .filters select {
      width: 100%;
      padding: 7px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 12px;
    }
    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover {
      background: #334155;
      border-color: rgba(148, 163, 184, 0.45);
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover {
      background: #dc2626;
    }
    .list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
    }
    .item:hover,
    .item.active {
      border-color: var(--accent-2);
      background: #172033;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .item-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      white-space: nowrap;
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .badge.sektor {
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
      border-color: rgba(59, 130, 246, 0.35);
    }
    .badge.sudin,
    .badge.dinas {
      background: rgba(249, 115, 22, 0.2);
      color: #fdba74;
      border-color: rgba(249, 115, 22, 0.4);
    }
    .item-meta {
      margin-top: 4px;
      font-size: 10.5px;
      color: var(--muted);
    }
    .item-addr {
      margin-top: 4px;
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.35;
    }
    #map {
      flex: 1;
      height: 100%;
      width: 100%;
      background: #0b1120;
    }
    .legend {
      position: absolute;
      bottom: 18px;
      right: 16px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 11px;
      z-index: 800;
      backdrop-filter: blur(6px);
    }
    .legend-title {
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 4px 0;
      color: #cbd5e1;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .leaflet-popup-content {
      color: #0f172a;
      font-size: 12px;
      line-height: 1.4;
      margin: 10px 12px;
    }
    @media (max-width: 768px) {
      body { height: auto; overflow: auto; }
      .main { flex-direction: column; height: auto; }
      aside { width: 100%; max-height: 45vh; border-right: none; border-bottom: 1px solid var(--border); }
      #map { height: 55vh; min-height: 360px; }
      .legend { bottom: 10px; right: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-badge">DKI</div>
      <div>
        <h1>Sebaran Pos, Sektor, Sudin &amp; Dinas Gulkarmat</h1>
        <p>Penanggulangan Kebakaran dan Penyelamatan Provinsi DKI Jakarta</p>
      </div>
    </div>
    <div class="header-right">
      <div class="stats">
        <div class="stat-pill">Total Titik:<strong id="statTotal">0</strong></div>
        <div class="stat-pill">Ditampilkan:<strong id="statShown">0</strong></div>
        <div class="stat-pill">Tandon Air:<strong id="statTandon">0</strong></div>
      </div>
      <div id="clockBox">Memuat waktu...</div>
    </div>
  </header>

  <div class="main">
    <aside>
      <div class="filters">
        <input id="searchInput" type="text" placeholder="Cari nama pos/sektor, alamat, kelurahan, kecamatan..." />
        <div class="filter-row">
          <select id="regionFilter">
            <option value="">Semua Wilayah</option>
            <option value="Jakpus">Jakarta Pusat</option>
            <option value="Jakut">Jakarta Utara</option>
            <option value="Jakbar">Jakarta Barat</option>
            <option value="Jaksel">Jakarta Selatan</option>
            <option value="Jaktim">Jakarta Timur</option>
            <option value="P. Seribu">Kep. Seribu</option>
          </select>
          <select id="subcatFilter">
            <option value="">Semua Kategori</option>
          </select>
        </div>
        <div class="btn-row">
          <button id="tandonBtn" type="button">Filter Tandon Air</button>
          <button id="resetBtn" type="button">Reset Filter</button>
          <button id="exportBtn" class="primary" type="button">Export JSON</button>
        </div>
      </div>
      <div id="locationList" class="list"></div>
    </aside>

    <div id="map">
      <div class="legend">
        <div class="legend-title">Legenda Titik</div>
        <div class="legend-item"><span class="dot" style="background:#ef4444;"></span> Pos Pemadam</div>
        <div class="legend-item"><span class="dot" style="background:#3b82f6;"></span> Kantor Sektor</div>
        <div class="legend-item"><span class="dot" style="background:#f97316;"></span> Sudin / UPT / Bengkel</div>
        <div class="legend-item"><span class="dot" style="background:#eab308;"></span> Dinas Provinsi</div>
      </div>
    </div>
  </div>

    const REGION_LABELS = {
      "Jakpus": "Jakarta Pusat",
      "Jakut": "Jakarta Utara",
      "Jakbar": "Jakarta Barat",
      "Jaksel": "Jakarta Selatan",
      "Jaktim": "Jakarta Timur",
      "P. Seribu": "Kepulauan Seribu"
    };

    let mapInstance = null;
    let markersLayer = null;
    let filteredData = [...DEFAULT_POS];
    let onlyTandon = false;
    let activeIndex = -1;

    function updateClock() {
      const el = document.getElementById("clockBox");
      if (!el) return;
      const now = new Date();
      el.textContent = now.toLocaleString("id-ID", {
        weekday: "short",
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        timeZone: "Asia/Jakarta"
      }) + " WIB";
    }

    function hasTandonAir(item) {
      return /tandon\s*air\s*:\s*ya/i.test(item.addr || "");
    }

    function getMarkerColor(item) {
      if (item.level === "dinas") return "#eab308";
      if (item.level === "sudin") return "#f97316";
      if (item.level === "sektor") return "#3b82f6";
      return "#ef4444";
    }

    function populateSubcats() {
      const select = document.getElementById("subcatFilter");
      if (!select) return;
      const cats = Array.from(new Set(DEFAULT_POS.map(d => d.subcat).filter(Boolean))).sort();
      cats.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    function renderStats() {
      const totalEl = document.getElementById("statTotal");
      const shownEl = document.getElementById("statShown");
      const tandonEl = document.getElementById("statTandon");
      if (totalEl) totalEl.textContent = DEFAULT_POS.length;
      if (shownEl) shownEl.textContent = filteredData.length;
      if (tandonEl) tandonEl.textContent = filteredData.filter(hasTandonAir).length;
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function focusItem(idx) {
      const item = filteredData[idx];
      if (!item) return;
      activeIndex = idx;
      renderList();

      if (mapInstance && typeof item.lat === "number" && typeof item.lng === "number") {
        mapInstance.setView([item.lat, item.lng], 15, { animate: true });
        if (markersLayer) {
          markersLayer.eachLayer(layer => {
            if (layer._posData && layer._posData.name === item.name && layer._posData.lat === item.lat) {
              layer.openPopup();
            }
          });
        }
      }
    }

    function renderList() {
      const listEl = document.getElementById("locationList");
      if (!listEl) return;
      listEl.innerHTML = "";

      if (filteredData.length === 0) {
        listEl.innerHTML = '<div style="padding:16px;text-align:center;color:#94a3b8;font-size:12px;">Tidak ada data yang cocok dengan filter.</div>';
        return;
      }

      filteredData.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "item" + (idx === activeIndex ? " active" : "");
        const badgeClass = item.level === "sektor" ? "badge sektor" : (item.level === "sudin" || item.level === "dinas" ? "badge sudin" : "badge");
        const tandonTag = hasTandonAir(item) ? " • Tandon Air: Ya" : "";
        div.innerHTML = `
          <div class="item-top">
            <div class="item-title">${escapeHtml(item.name)}</div>
            <span class="${badgeClass}">${escapeHtml(item.subcat || item.level)}</span>
          </div>
          <div class="item-meta">${escapeHtml(REGION_LABELS[item.region] || item.region)}${escapeHtml(tandonTag)}</div>
          <div class="item-addr">${escapeHtml(item.addr)}</div>
        `;
        div.addEventListener("click", () => focusItem(idx));
        listEl.appendChild(div);
      });
    }

    function renderMarkers() {
      if (!mapInstance || !window.L) return;
      if (!markersLayer) {
        markersLayer = L.layerGroup().addTo(mapInstance);
      } else {
        markersLayer.clearLayers();
      }

      const bounds = [];
      filteredData.forEach((item, idx) => {
        if (typeof item.lat !== "number" || typeof item.lng !== "number") return;
        const color = getMarkerColor(item);
        const marker = L.circleMarker([item.lat, item.lng], {
          radius: item.level === "pos" ? 6.5 : 8.5,
          fillColor: color,
          color: "#ffffff",
          weight: 1.5,
          opacity: 1,
          fillOpacity: 0.9
        });
        marker._posData = item;
        marker.bindPopup(`
          <div>
            <strong>${escapeHtml(item.name)}</strong><br/>
            <span style="color:#475569;font-size:11px;">${escapeHtml(item.subcat)} • ${escapeHtml(REGION_LABELS[item.region] || item.region)}</span><br/>
            <p style="margin:6px 0 0;font-size:11.5px;">${escapeHtml(item.addr)}</p>
            <small style="color:#64748b;">Koordinat: ${item.lat}, ${item.lng}</small>
          </div>
        `);
        marker.on("click", () => {
          activeIndex = idx;
          renderList();
        });
        marker.addTo(markersLayer);
        bounds.push([item.lat, item.lng]);
      });

      if (bounds.length > 0) {
        mapInstance.fitBounds(bounds, { padding: [30, 30], maxZoom: 13 });
      }
    }

    function applyFilters() {
      const q = (document.getElementById("searchInput")?.value || "").trim().toLowerCase();
      const region = document.getElementById("regionFilter")?.value || "";
      const subcat = document.getElementById("subcatFilter")?.value || "";

      filteredData = DEFAULT_POS.filter(item => {
        if (region && item.region !== region) return false;
        if (subcat && item.subcat !== subcat) return false;
        if (onlyTandon && !hasTandonAir(item)) return false;
        if (q) {
          const hay = `${item.name} ${item.subcat} ${item.region} ${item.addr}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      activeIndex = -1;
      renderStats();
      renderList();
      renderMarkers();
    }

    function initMap() {
      if (!window.L || mapInstance) return;
      mapInstance = L.map("map", { zoomControl: true }).setView([-6.2088, 106.8456], 11);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(mapInstance);
      renderMarkers();
    }

    function loadLeafletScript(urls, idx, callback) {
      if (idx >= urls.length) {
        if (callback) callback();
        return;
      }
      var s = document.createElement("script");
      s.src = urls[idx];
      s.async = true;
      s.onload = function() {
        if (window.L) callback();
        else loadLeafletScript(urls, idx + 1, callback);
      };
      s.onerror = function() { loadLeafletScript(urls, idx + 1, callback); };
      document.head.appendChild(s);
    }

    document.addEventListener("DOMContentLoaded", function() {
      updateClock();
      setInterval(updateClock, 1000);
      populateSubcats();
      renderStats();
      renderList();

      document.getElementById("searchInput")?.addEventListener("input", applyFilters);
      document.getElementById("regionFilter")?.addEventListener("change", applyFilters);
      document.getElementById("subcatFilter")?.addEventListener("change", applyFilters);

      document.getElementById("tandonBtn")?.addEventListener("click", function() {
        onlyTandon = !onlyTandon;
        this.classList.toggle("primary", onlyTandon);
        applyFilters();
      });

      document.getElementById("resetBtn")?.addEventListener("click", function() {
        const sEl = document.getElementById("searchInput");
        const rEl = document.getElementById("regionFilter");
        const cEl = document.getElementById("subcatFilter");
        const tBtn = document.getElementById("tandonBtn");
        if (sEl) sEl.value = "";
        if (rEl) rEl.value = "";
        if (cEl) cEl.value = "";
        onlyTandon = false;
        if (tBtn) tBtn.classList.remove("primary");
        applyFilters();
      });

      document.getElementById("exportBtn")?.addEventListener("click", function() {
        const blob = new Blob([JSON.stringify(filteredData, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "gulkarmat-dki-jakarta.json";
        a.click();
        URL.revokeObjectURL(url);
      });

      loadLeafletScript([
        "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js",
        "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
      ], 0, initMap);
    });
  </script>
</body>
</html>
